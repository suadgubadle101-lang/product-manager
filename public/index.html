<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Produktadministration</h1>
        </header>

        <!-- Formulär för att lägga till produkt -->
        <form id="product-form">
            <div class="form-group">
                <label for="name">Produktnamn</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="price">Pris</label>
                <!-- type="number" och min="1" ger HTML-validering för positiva tal -->
                <input type="number" id="price" name="price" min="0.01" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="sku">SKU</label>
                <input type="text" id="sku" name="sku" required>
            </div>

            <div class="form-group">
                <label for="description">Beskrivning</label>
                <textarea id="description" name="description" required></textarea>
            </div>

            <button type="submit" id="submit-btn">Lägg till produkt</button>
        </form>

        <!-- Tabell för produkter -->
        <table id="product-table">
            <thead>
                <tr>
                    <th>Produkt</th>
                    <th>SKU</th>
                    <th>Pris</th>
                    <th></th> <!-- Tom kolumn för radera-knappen -->
                </tr>
            </thead>
            <tbody id="product-list">
                <!-- Här kommer JavaScript lägga in raderna -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
